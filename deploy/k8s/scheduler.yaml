# One replica is enough; concurrent schedulers are safe (per-transaction advisory lock) but redundant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 1
  selector:
    matchLabels: { app: scheduler }
  template:
    metadata:
      labels: { app: scheduler }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: scheduler
          image: sentinel
          command: ["python", "-m", "sentinel.workers.scheduler"]
          ports: [{ containerPort: 9100, name: metrics }]
          envFrom:
            - configMapRef: { name: sentinel-config }
            - secretRef: { name: sentinel-secrets }
          securityContext: { allowPrivilegeEscalation: false }
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "500m", memory: 192Mi }
