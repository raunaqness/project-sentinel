# Non-secret settings shared by every Sentinel process (see .env.example for all options).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
data:
  SENTINEL_ENVIRONMENT: production
  SENTINEL_LOG_LEVEL: INFO
  SENTINEL_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  SENTINEL_REDIS_URL: redis://redis:6379/0
  SENTINEL_INVESTIGATOR: openrouter
  SENTINEL_LLM_MODEL: openai/gpt-4o-mini
  SENTINEL_EMBEDDER: openrouter
  SENTINEL_LLM_RATE_PER_SECOND: "20"
  SENTINEL_WORKER_CONCURRENCY: "4"
  SENTINEL_LEASE_SECONDS: "60"
  SENTINEL_MAX_ATTEMPTS: "3"
  SENTINEL_RETRY_BACKOFF_SECONDS: "5"
  SENTINEL_MISSING_SETTLEMENT_SECONDS: "86400"
  SENTINEL_RECONCILIATION_GRACE_SECONDS: "300"
  SENTINEL_SCHEDULER_INTERVAL_SECONDS: "30"
