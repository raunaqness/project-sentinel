name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, types, unit tests, manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m "not integration"
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize deploy/k8s > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml

  integration:
    name: Integration tests and walkthrough (compose stack)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Start the stack (dev timings, mock LLM and embeddings)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
          make seed
      - run: uv run pytest -m integration
      - run: scripts/walkthrough.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v

  image:
    name: Container image build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: project-sentinel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
