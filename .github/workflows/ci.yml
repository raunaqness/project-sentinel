name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m "not integration"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file sets
        env:
          POSTGRES_PASSWORD: ci
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.vps.yml config -q
      - name: Bring up infrastructure and wait for health
        env:
          POSTGRES_PASSWORD: ci
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 180
      - if: always()
        run: docker compose -f docker-compose.yml down -v
